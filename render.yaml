services:
  - type: web
    name: inventory-api
    runtime: node
    region: oregon
    rootDir: backend
    nodeVersion: "20"
    # Backend is plain Node.js/Express (no TypeScript build step). Build the
    # Prisma client, then build the React frontend into frontend/dist/. The
    # backend (app.js) serves frontend/dist as static assets in production,
    # so both must exist before the server starts.
    buildCommand: |
      npm install
      npx prisma generate
      cd ../frontend && npm install && npm run build
    # Apply Prisma migrations on every (re)deploy, then start the server.
    # No seed or bootstrap step: the database starts empty and the first user
    # is created manually (see backend/scripts/create-user.js).
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      # --- Non-secret defaults ---
      - key: NODE_ENV
        value: production
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "300"
      # --- Database (provided automatically by the Render database below) ---
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      # --- Secrets (create these in the Render dashboard before deploying) ---
      # Generate each with: node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      - key: JWT_ACCESS_SECRET
        fromSecret: JWT_ACCESS_SECRET
      - key: JWT_REFRESH_SECRET
        fromSecret: JWT_REFRESH_SECRET
      # CORS allowlist for the deployed frontend domain(s). Comma-separated
      # list of exact origins, e.g.
      #   https://frontend-9lfu.onrender.com,https://your-custom-domain.com
      # Set this value on the backend service in the Render dashboard
      # (Environment -> CORS_ORIGIN); a wildcard ("*") is rejected in production.
      - key: CORS_ORIGIN
        fromSecret: CORS_ORIGIN

databases:
  - name: inventory-db
    databaseName: inventory
    plan: free
    region: oregon